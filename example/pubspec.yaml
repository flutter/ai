name: flutter_ai_toolkit_example
description: >-
  Sample apps showing off various features of the Flutter AI Toolkit.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: '>=3.27.0-0'

dependencies:
  flutter:
    sdk: flutter
  flutter_ai_toolkit:
    path: ..
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  go_router: ^17.3.0
  uuid: ^4.5.3
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_markdown_plus: ^1.0.7
  google_fonts: ^8.1.0
  future_builder_ex: ^5.0.0
  split_view: ^3.2.2
  firebase_core: ^4.10.0
  firebase_ai: ^3.12.2
  cross_file: ^0.3.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/recipes_default.json
    - assets/halloween-bg.png
